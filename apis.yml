aid: plain
name: Plain
description: >-
  Plain is a customer support platform for B2B and technical SaaS companies,
  built entirely on its own public GraphQL API so there is full parity between
  what the product UI and the API can do. It unifies support across email,
  chat, Slack, and API-created threads, with customers, companies, tenants,
  tiers and SLAs, labels, help center articles, snippets, tasks, and events as
  first-class entities. Developers integrate via a Relay-style GraphQL API
  (bearer API keys with fine-grained permissions), typed TypeScript and Go
  SDKs, a CLI, customer-card UI components, HMAC-signed webhooks, a hosted MCP
  server, and an official agent skill. This profile was enriched from Plain's
  public developer surface.
